name: Crowdin

on:
  push:
    branches: [master]
    paths:
      - 'GlamourLog/Resources/Localization/UIStrings.resx'
      - 'crowdin.yml'
  schedule:
    - cron: '0 6 * * *' 
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  synchronize-with-crowdin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crowdin
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: false
          download_translations: true
          skip_untranslated_strings: true
          localization_branch_name: l10n_crowdin_translations
          create_pull_request: true
          pull_request_title: 'chore(i18n): Crowdin translations'
          pull_request_body: 'New Crowdin translations via [crowdin/github-action](https://github.com/crowdin/github-action).'
          pull_request_base_branch_name: master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
